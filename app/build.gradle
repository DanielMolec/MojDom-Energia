plugins { id 'com.android.application' }

android {
    namespace 'pl.mojdom.energia'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.mojdom.energia'
        minSdk 26
        targetSdk 35
        // Każda kompilacja w GitHub Actions dostaje wyższy numer wersji,
        // dzięki czemu nowy APK instaluje się jako aktualizacja (bez odinstalowania, z zachowaniem ustawień).
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "0") as Integer
        versionCode 100 + run
        versionName "1.2." + run
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "mojdom-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // Opcjonalnie: pozwala budować podpisany debug lokalnie, jeśli masz zmienne środowiskowe
            if (System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}