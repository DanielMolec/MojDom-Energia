# automations.yaml — wersja z odciążoną magistralą eBUS
# Zmiany względem poprzedniej wersji:
#  - usunięto: ebus_gaz_odczyt_5s, ebus_panel_kotla_odczyt_5s,
#    1785165599119 (szybki odczyt pompy i zaworu), 1785179370792 (cykliczny odczyt kotła)
#  - dodano: ebus_odczyt_szybki (co 10 s, 6 odczytów) i ebus_odczyt_wolny (co 2 min)
#  - usunięto odczyt bai HwcTempMax (kocioł go nie obsługuje: "ERR: invalid position")
#  - "E7C - ustaw temperaturę z HA": dodano warunek, żeby przy restarcie HA
#    nie wysyłać do E7C wartości unknown/unavailable

- id: ebus_odczyt_szybki
  alias: "eBUS — szybki odczyt pracy kotła (co 10 s)"
  description: "Tylko dane do animacji i zużycia gazu. Bez HwcTempMax (kocioł go nie obsługuje)."
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: time_pattern
      seconds: "/10"
  conditions: []
  actions:
    - repeat:
        for_each:
          - ebusd/bai/Status01/get
          - ebusd/bai/Flame/get
          - ebusd/bai/ModulationDesired/get
          - ebusd/bai/PositionValveSet/get
          - ebusd/bai/FanSpeed/get
          - ebusd/bai/PumpPower/get
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ repeat.item }}"
              payload: ""
              qos: 0
              retain: false
          - delay:
              milliseconds: 400

- id: ebus_odczyt_wolny
  alias: "eBUS — wolny odczyt parametrów (co 2 min)"
  description: "Parametry, które zmieniają się powoli."
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/2"
  conditions: []
  actions:
    - repeat:
        for_each:
          - ebusd/bai/WaterPressure/get
          - ebusd/bai/FlowTempDesired/get
          - ebusd/e7c/HeatCurve/get
          - ebusd/e7c/PrevHeatCurve/get
          - ebusd/e7c/RoomTemp/get
          - ebusd/bai/PumpHours/get
          - ebusd/bai/HcPumpStarts/get
          - ebusd/bai/FlowTempMax/get
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ repeat.item }}"
              payload: ""
              qos: 0
              retain: false
          - delay:
              seconds: 1

- id: e846788a629440ac8597d44e917387b9
  alias: "E7C: ustaw krzywą grzewczą"
  triggers:
    - trigger: state
      entity_id: input_number.e7c_heatcurve
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state.state not in
           ['unknown', 'unavailable', 'none', ''] }}
  actions:
    - delay: "00:00:01"
    - action: mqtt.publish
      data:
        topic: ebusd/e7c/HeatCurve/set
        payload: "{{ '%.2f' | format(trigger.to_state.state | float) }}"
        retain: false
    - delay: "00:00:02"
    - action: mqtt.publish
      data:
        topic: ebusd/e7c/HeatCurve/get
        payload: ""
        retain: false
  mode: restart

- id: "1785173925222"
  alias: "E7C - ustaw temperaturę z HA"
  description: ""
  triggers:
    - trigger: state
      entity_id:
        - input_number.e7c_temp_set
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.to_state.state not in ['unknown', 'unavailable'] }}
  actions:
    - action: mqtt.publish
      data:
        topic: ebusd/e7c/HeatingTempSet/set
        payload: "{{ trigger.to_state.state }}"
  mode: restart

- id: "1785175547520"
  alias: "E7C - sterowanie CO i CWU"
  description: "Sterowanie ogrzewaniem i ciepłą wodą przez MQTT eBUSd"
  triggers:
    - trigger: state
      entity_id:
        - input_boolean.e7c_ogrzewanie_co
        - input_boolean.e7c_cwu
        - input_number.e7c_temperatura_cwu
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.to_state.state not in ['unknown', 'unavailable'] }}
  actions:
    - action: mqtt.publish
      data:
        topic: "{{ mqtt_topics[trigger.entity_id] }}"
        payload: "{{ trigger.to_state.state }}"
  variables:
    mqtt_topics:
      input_boolean.e7c_ogrzewanie_co: ebusd/e7c/HeatingEnable/set
      input_boolean.e7c_cwu: ebusd/e7c/DHWEnable/set
      input_number.e7c_temperatura_cwu: ebusd/e7c/DHWTempSet/set
  mode: restart

- id: "1785180257626"
  alias: "eBUS - odczyt ciśnienia instalacji"
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: /1
  conditions: []
  actions:
    - action: mqtt.publish
      data:
        topic: ebusd/bai/WaterPressure/get
        payload: ""
  mode: single

- id: "1785342718477"
  alias: "E7C - synchronizuj krzywą z eBUS"
  triggers:
    - trigger: state
      entity_id: sensor.krzywa_grzewcza
  conditions:
    - condition: template
      value_template: >-
        {{ has_value('sensor.krzywa_grzewcza')
           and
           ((states('input_number.e7c_heatcurve') | float(0))
            - (states('sensor.krzywa_grzewcza') | float(0))) | abs > 0.01 }}
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.e7c_heatcurve
      data:
        value: "{{ states('sensor.krzywa_grzewcza') | float }}"
  mode: restart

- id: "1787160718368"
  alias: "eBUS - alarmy techniczne kotła"
  description: "Alarmy kotła w Home Assistant i na telefonie"
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.ebus_alarm_wysokie_cisnienie
        - binary_sensor.ebus_alarm_niskie_cisnienie
        - binary_sensor.ebus_alarm_brak_sygnalu
        - binary_sensor.ebus_alarm_taktowanie_palnika
        - binary_sensor.ebus_alarm_pompa_nie_pracuje
  conditions: []
  actions:
    - variables:
        alarm_id: "{{ trigger.entity_id | replace('.', '_') }}"
        alarm_name: >-
          {{ state_attr(trigger.entity_id, 'friendly_name')
             | default(trigger.entity_id, true) }}
        alarm_message: >-
          {% if trigger.entity_id == 'binary_sensor.ebus_alarm_wysokie_cisnienie' %}
            Zbyt wysokie ciśnienie instalacji:
            {{ states('sensor.cisnienie_instalacji') }} bar.
          {% elif trigger.entity_id == 'binary_sensor.ebus_alarm_niskie_cisnienie' %}
            Zbyt niskie ciśnienie instalacji:
            {{ states('sensor.cisnienie_instalacji') }} bar.
          {% elif trigger.entity_id == 'binary_sensor.ebus_alarm_brak_sygnalu' %}
            Brak komunikacji Home Assistant z magistralą eBUS.
          {% elif trigger.entity_id == 'binary_sensor.ebus_alarm_taktowanie_palnika' %}
            Zbyt częste uruchamianie palnika:
            {{ states('sensor.ebus_starty_palnika_ostatnia_godzina') }}
            uruchomień w ciągu godziny.
          {% elif trigger.entity_id == 'binary_sensor.ebus_alarm_pompa_nie_pracuje' %}
            Palnik pracuje, ale moc pompy wynosi tylko
            {{ states('sensor.ebusd_bai_pumppower') }}%.
          {% else %}
            Wykryto problem techniczny instalacji grzewczej.
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: "{{ alarm_id }}"
                title: "⚠️ Alarm kotła"
                message: "{{ alarm_message }}"
            - action: notify.mobile_app_2312dra50g
              data:
                title: "⚠️ Alarm kotła"
                message: "{{ alarm_message }}"
                data:
                  tag: "{{ alarm_id }}"
                  channel: "Alarmy kotła"
                  importance: high
                  priority: high
                  ttl: 0
                  color: "#F44336"
                  notification_icon: mdi:alert
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'off' }}"
          sequence:
            - action: persistent_notification.dismiss
              continue_on_error: true
              data:
                notification_id: "{{ alarm_id }}"
            - action: notify.mobile_app_2312dra50g
              data:
                title: "✅ Alarm kotła zakończony"
                message: "{{ alarm_name }} — parametry wróciły do normy."
                data:
                  tag: "{{ alarm_id }}"
                  channel: "Alarmy kotła"
                  importance: default
                  color: "#4CAF50"
                  notification_icon: mdi:check-circle
  mode: parallel
  max: 10

- id: "1787163885920"
  alias: "eBUS - odczyt aktualnego błędu kotła"
  description: "Cykliczny odczyt Currenterror z BAI"
  triggers:
    - trigger: homeassistant
