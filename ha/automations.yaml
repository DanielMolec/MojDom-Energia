- id: ebus_monitor_polaczenia_diagnostycznego
  alias: "eBUS: monitor połączenia diagnostycznego"
  description: "Ostrzeżenie po 5 minutach braku sygnału lub ważnych danych"
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.ebus_polaczenie_diagnostyczne
      to: "off"
      id: brak
    - trigger: state
      entity_id: binary_sensor.ebus_polaczenie_diagnostyczne
      to: "on"
      id: powrot
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: brak
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: ebus_polaczenie_diagnostyczne
                title: "eBUS — brak pełnych danych"
                message: >-
                  Przez co najmniej 5 minut brakuje sygnału eBUS albo
                  jednego z wymaganych odczytów.

                  Status: {{ states('sensor.ebus_status_diagnostyki') }}

                  Brakujące dane:
                  {{ state_attr('sensor.ebus_status_diagnostyki',
                                'brakujace_encje') | default('nieustalone', true) }}

                  Ostatni poprawny odczyt:
                  {{ states('sensor.ebus_ostatni_poprawny_odczyt') }}
        - conditions:
            - condition: trigger
              id: powrot
          sequence:
            - action: persistent_notification.dismiss
              continue_on_error: true
              data:
                notification_id: ebus_polaczenie_diagnostyczne

- id: ebus_monitor_jakosci_sieci
  alias: "eBUS: monitor jakości sieci"
  description: >-
    Rozróżnia problem adaptera Wi-Fi i hosta ebusd; reaguje dopiero po
    dwóch minutach utrzymującego się pogorszenia.
  mode: queued
  max: 4
  triggers:
    - trigger: state
      entity_id: binary_sensor.ebus_alarm_sieci_adaptera
      to: "on"
      id: adapter_problem
    - trigger: state
      entity_id: binary_sensor.ebus_alarm_sieci_adaptera
      to: "off"
      id: adapter_ok
    - trigger: state
      entity_id: binary_sensor.ebus_alarm_sieci_hosta
      to: "on"
      id: host_problem
    - trigger: state
      entity_id: binary_sensor.ebus_alarm_sieci_hosta
      to: "off"
      id: host_ok
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: adapter_problem
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: ebus_siec_adapter
                title: "eBUS — problem sieci adaptera"
                message: >-
                  Diagnoza: {{ states('sensor.ebus_diagnoza_sieci') }}

                  Jakość: {{ states('sensor.ebus_jakosc_sieci_adaptera') }}

                  Ping średni:
                  {{ states('sensor.192_168_88_42_round_trip_time_average') }} ms

                  Ping maksymalny:
                  {{ states('sensor.192_168_88_42_round_trip_time_maximum') }} ms

                  Jitter: {{ states('sensor.192_168_88_42_jitter') }} ms

                  Utrata pakietów:
                  {{ states('sensor.192_168_88_42_packet_loss') }}%

        - conditions:
            - condition: trigger
              id: host_problem
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: ebus_siec_host
                title: "eBUS — problem sieci hosta"
                message: >-
                  Diagnoza: {{ states('sensor.ebus_diagnoza_sieci') }}

                  Jakość: {{ states('sensor.ebus_jakosc_sieci_hosta') }}

                  Ping średni:
                  {{ states('sensor.192_168_88_84_round_trip_time_average') }} ms

                  Ping maksymalny:
                  {{ states('sensor.192_168_88_84_round_trip_time_maximum') }} ms

                  Jitter: {{ states('sensor.192_168_88_84_jitter') }} ms

                  Utrata pakietów:
                  {{ states('sensor.192_168_88_84_packet_loss') }}%

        - conditions:
            - condition: trigger
              id: adapter_ok
          sequence:
            - action: persistent_notification.dismiss
              continue_on_error: true
              data:
                notification_id: ebus_siec_adapter

        - conditions:
            - condition: trigger
              id: host_ok
          sequence:
            - action: persistent_notification.dismiss
              continue_on_error: true
              data:
                notification_id: ebus_siec_host

- id: e7c_przypomnienie_serwis_30_dni
  alias: "E7C: przypomnienie 30 dni przed serwisem"
  description: "Powiadomienie w HA od 30 dni przed terminem i po terminie."
  mode: restart

  triggers:
    - trigger: time
      at: "09:00:00"

    - trigger: homeassistant
      event: start

    - trigger: state
      entity_id: sensor.e7c_termin_serwisu

  actions:
    - variables:
        termin_tekst: "{{ states('sensor.e7c_termin_serwisu') }}"

    # Nie obliczaj terminu z niedostępnych danych.
    - condition: template
      value_template: >-
        {{ strptime(termin_tekst, '%d.%m.%Y %H:%M', none) is not none }}

    # Różnica dat kalendarzowych — bez przesunięć przez zmianę czasu.
    - variables:
        dni: >-
          {% set termin = strptime(termin_tekst, '%d.%m.%Y %H:%M') %}
          {{ (termin.date() - now().date()).days }}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ dni | int <= 30 }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: e7c_serwis_30_dni
                title: "Przypomnienie o serwisie kotła"
                message: >-
                  {% set d = dni | int %}
                  {% if d < 0 %}
                    Termin serwisu minął {{ -d }} dni temu.
                  {% elif d == 0 %}
                    Termin serwisu przypada dzisiaj.
                  {% else %}
                    Do terminu serwisu pozostało {{ d }} dni.
                  {% endif %}

                  Termin zapisany w E7C: {{ termin_tekst }}.

                  Umów przegląd w autoryzowanym serwisie.

      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: e7c_serwis_30_dni
