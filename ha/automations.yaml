- id: e7c_automatyczna_regulacja_krzywej
  alias: "E7C: automatyczna regulacja krzywej grzewczej"
  description: "Korekta krzywej maksymalnie o 0,1 raz na 48 godzin"
  mode: single
  triggers:
    - trigger: time
      at: "12:15:00"
  conditions:
    - condition: state
      entity_id: input_boolean.e7c_automatyczna_krzywa
      state: "on"
    - condition: state
      entity_id: input_boolean.e7c_ogrzewanie_co
      state: "on"
      for:
        hours: 6
    - condition: numeric_state
      entity_id: sensor.e7c_mediana_temperatura_zewnetrzna_24h
      below: 10
    - condition: template
      value_template: >-
        {{ state_attr('sensor.e7c_srednia_temperatura_korytarza_24h',
                      'age_coverage_ratio') | float(0) >= 0.8 }}
    - condition: template
      value_template: >-
        {{ state_attr('sensor.e7c_mediana_temperatura_zewnetrzna_24h',
                      'age_coverage_ratio') | float(0) >= 0.8 }}
    - condition: template
      value_template: >-
        {% set ostatnia =
          states('input_datetime.e7c_ostatnia_automatyczna_zmiana') %}
        {{ ostatnia in ['unknown', 'unavailable', 'none', '']
           or (as_timestamp(now()) - as_timestamp(ostatnia, 0)) >= 172800 }}
  actions:
    - variables:
        pokoj_srednia: >-
          {{ states('sensor.e7c_srednia_temperatura_korytarza_24h')
             | float(none) }}
        zadana: >-
          {% if is_state('input_boolean.e7c_harmonogram_komfortu', 'on') %}
            21.7
          {% else %}
            {{ states('input_number.e7c_temp_set') | float(none) }}
          {% endif %}
        aktualna: >-
          {% set odczyt = states('sensor.krzywa_grzewcza') | float(none) %}
          {{ odczyt if odczyt is not none
             else (states('input_number.e7c_heatcurve') | float(none)) }}
        zewnatrz_mediana: >-
          {{ states('sensor.e7c_mediana_temperatura_zewnetrzna_24h')
             | float(none) }}
    - condition: template
      value_template: >-
        {{ pokoj_srednia is not none and zadana is not none
           and aktualna is not none and zewnatrz_mediana is not none }}
    - variables:
        roznica: >-
          {{ ((zadana | float) - (pokoj_srednia | float)) | round(2) }}
    - condition: template
      value_template: "{{ (roznica | float | abs) >= 0.7 }}"
    - variables:
        nowa_krzywa: >-
          {% set k = aktualna | float %}
          {% set blad = roznica | float %}
          {% if blad >= 0.7 %}
            {{ ([k + 0.1, 1.5] | min) if k < 1.5 else k }}
          {% elif blad <= -0.7 %}
            {{ ([k - 0.1, 0.3] | max) if k > 0.3 else k }}
          {% else %}
            {{ k }}
          {% endif %}
        powod: >-
          {% if (roznica | float) >= 0.7 %}
            Średnia temperatura w domu była za niska.
          {% else %}
            Średnia temperatura w domu była za wysoka.
          {% endif %}
    - condition: template
      value_template: >-
        {{ (nowa_krzywa | float) != (aktualna | float) }}
    - action: input_number.set_value
      target:
        entity_id: input_number.e7c_proponowana_krzywa
      data:
        value: "{{ nowa_krzywa | float | round(1) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.e7c_heatcurve
      data:
        value: "{{ nowa_krzywa | float | round(1) }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.e7c_ostatnia_automatyczna_zmiana
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: persistent_notification.create
      data:
        notification_id: e7c_automatyczna_zmiana_krzywej
        title: "Automatycznie zmieniono krzywą"
        message: >-
          Krzywa: {{ aktualna }} → {{ nowa_krzywa | float | round(1) }}

          Średnia temperatura zadana: {{ zadana }}°C

          Średnia temperatura w domu: {{ pokoj_srednia }}°C

          Mediana temperatury zewnętrznej z 24 h:
          {{ zewnatrz_mediana }}°C

          {{ powod }}

- id: e7c_harmonogram_komfortu_22_21
  alias: "E7C: harmonogram komfortu 22/21°C"
  description: "22°C od 06:00 do 22:30 oraz 21°C w nocy"
  mode: restart
  triggers:
    - trigger: time
      at: "06:00:00"
    - trigger: time
      at: "22:30:00"
    - trigger: state
      entity_id: input_boolean.e7c_harmonogram_komfortu
      to: "on"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.e7c_harmonogram_komfortu
      state: "on"
  actions:
    - variables:
        temperatura_docelowa: >-
          {% set teraz = now() %}
          {% set poczatek = today_at('06:00') %}
          {% set koniec = today_at('22:30') %}
          {{ 22.0 if poczatek <= teraz < koniec else 21.0 }}
    - condition: template
      value_template: >-
        {{ (states('input_number.e7c_temp_set') | float(0)
            - temperatura_docelowa | float) | abs > 0.01 }}
    - action: input_number.set_value
      target:
        entity_id: input_number.e7c_temp_set
      data:
        value: "{{ temperatura_docelowa | float }}"

- id: e7c_ochrona_minimalnego_komfortu
  alias: "E7C: ochrona minimalnego komfortu"
  description: "Podnosi temperaturę zadaną do 22°C, gdy w domu jest zbyt chłodno"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.heating_ebusd_e7c_temperatura_na_korytarzu
      below: 20.5
      for:
        minutes: 20
  conditions:
    - condition: state
      entity_id: input_boolean.e7c_harmonogram_komfortu
      state: "on"
    - condition: state
      entity_id: input_boolean.e7c_ogrzewanie_co
      state: "on"
    - condition: template
      value_template: >-
        {{ states('input_number.e7c_temp_set') | float(0) < 22.0 }}
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.e7c_temp_set
      data:
        value: 22.0
    - action: persistent_notification.create
      data:
        notification_id: e7c_ochrona_minimalnego_komfortu
        title: "E7C: uruchomiono ochronę komfortu"
        message: >-
          Temperatura pokojowa zmierzona przez E7C utrzymywała się poniżej 20,5°C
          przez 20 minut. Temperaturę zadaną podniesiono do 22°C.

