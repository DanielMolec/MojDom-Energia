- id: "1789153616997"
  alias: "Utomatyzacja krzywej grzewczej"
  description: ""
  triggers: []
  conditions: []
  actions:
    - action: button.press
      metadata: {}
      target:
        label_id: ogrzewanie
      data: {}
  mode: single

- id: e7c_licznik_dni_zimnych
  alias: "E7C: aktualizuj licznik dni chłodnych (sezon grzewczy)"
  description: >-
    Raz dziennie zlicza kolejne pełne doby, w których mediana
    temperatury zewnętrznej pozostawała poniżej 10°C.
  mode: single
  triggers:
    - trigger: time
      at: "23:55:00"
  conditions:
    - condition: template
      value_template: >-
        {{
          is_number(states(
            'sensor.e7c_mediana_temperatura_zewnetrzna_24h'
          ))
          and
          state_attr(
            'sensor.e7c_mediana_temperatura_zewnetrzna_24h',
            'age_coverage_ratio'
          ) | float(0) >= 0.8
        }}
  actions:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.e7c_mediana_temperatura_zewnetrzna_24h
              below: 10
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.e7c_dni_pod_rzad_zimno
      default:
        - action: counter.reset
          target:
            entity_id: counter.e7c_dni_pod_rzad_zimno

